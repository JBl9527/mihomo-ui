<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihomo Web 控制台 V2</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <style>
        body { background-color: #1e1e1e; color: #d4d4d4; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .el-card, .el-tabs--border-card { background-color: #252526; border: 1px solid #3e3e42; color: #d4d4d4; margin-bottom: 20px; }
        .el-card__header { border-bottom: 1px solid #3e3e42; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        .title { margin: 0; font-size: 1.2rem; font-weight: bold; color: #4fc08d; }
        /* 覆盖 Element UI 暗黑样式 */
        .el-input__wrapper, .el-textarea__inner { background-color: #1e1e1e; box-shadow: none !important; border: 1px solid #555; color: #fff; }
        .el-form-item__label, .el-tabs__item { color: #d4d4d4 !important; }
        .el-tabs__item.is-active { color: #4fc08d !important; background-color: #1e1e1e !important;}
        .el-textarea__inner { color: #ce9178; font-family: monospace; font-size: 14px;}
    </style>
</head>
<body>
    <div id="app" class="container">
        <el-card>
            <template #header>
                <div class="header-flex">
                    <h2 class="title">🚀 Mihomo 配置管理</h2>
                    <div>
                        <el-button type="success" @click="openZashboard">打开 Zashboard 面板</el-button>
                        <el-button type="danger" @click="restartMihomo" :loading="restarting">重启内核</el-button>
                    </div>
                </div>
            </template>
            
            <el-tabs type="border-card" v-model="activeTab">
                <!-- 模式 1：机场订阅 -->
                <el-tab-pane label="🔗 极简机场订阅" name="sub">
                    <el-form label-width="120px" @submit.prevent>
                        <el-form-item label="机场订阅链接">
                            <el-input v-model="subUrl" placeholder="请输入你的机场订阅 URL" clearable></el-input>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" @click="updateSub" :loading="updating">注入模板</el-button>
                            <span style="margin-left:15px; color:#888; font-size:13px;">（生成后请点击右上方“重启内核”）</span>
                        </el-form-item>
                    </el-form>
                </el-tab-pane>

                <!-- 模式 2：手动 YAML -->
                <el-tab-pane label="📝 手动 YAML 配置" name="raw">
                    <div style="margin-bottom: 10px; color: #aaa; font-size: 14px;">将你备份的完整 config.yaml 内容粘贴在下方，点击保存。</div>
                    <el-input type="textarea" :rows="15" v-model="rawYaml" placeholder="在此粘贴完整的 yaml 内容..."></el-input>
                    <div style="margin-top: 15px;">
                        <el-button type="primary" @click="saveRawYaml" :loading="updating">💾 覆盖保存此配置</el-button>
                    </div>
                </el-tab-pane>
            </el-tabs>
        </el-card>

        <el-card>
            <template #header>
                <div class="header-flex">
                    <span>当前系统中运行的 /etc/mihomo/config.yaml</span>
                    <el-button size="small" type="info" @click="loadConfig">刷新预览</el-button>
                </div>
            </template>
            <el-input type="textarea" :rows="22" v-model="configText" readonly></el-input>
        </el-card>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue
        const { ElMessage } = ElementPlus

        createApp({
            setup() {
                const activeTab = ref('sub')
                const subUrl = ref('')
                const rawYaml = ref('')
                const configText = ref('')
                const restarting = ref(false)
                const updating = ref(false)

                const loadConfig = async () => {
                    try {
                        const res = await fetch('/api/config')
                        const data = await res.json()
                        configText.value = data.config
                        rawYaml.value = data.config // 把当前配置顺便同步到输入框里
                    } catch (e) {
                        ElMessage.error('无法读取配置文件')
                    }
                }

                const updateSub = async () => {
                    if (!subUrl.value) return ElMessage.warning('请输入订阅链接！')
                    updating.value = true
                    try {
                        const res = await fetch('/api/update_sub', {
                            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({sub_url: subUrl.value})
                        })
                        const data = await res.json()
                        ElMessage({ message: data.msg, type: data.status })
                        if (data.status === 'success') await loadConfig()
                    } catch (e) { ElMessage.error('请求失败') }
                    updating.value = false
                }

                const saveRawYaml = async () => {
                    if (!rawYaml.value) return ElMessage.warning('YAML 内容不能为空！')
                    updating.value = true
                    try {
                        const res = await fetch('/api/save_raw', {
                            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({raw_yaml: rawYaml.value})
                        })
                        const data = await res.json()
                        ElMessage({ message: data.msg, type: data.status })
                        if (data.status === 'success') await loadConfig()
                    } catch (e) { ElMessage.error('请求失败') }
                    updating.value = false
                }

                const restartMihomo = async () => {
                    restarting.value = true
                    try {
                        const res = await fetch('/api/restart', { method: 'POST' })
                        const data = await res.json()
                        ElMessage({ message: data.msg, type: data.status })
                    } catch (e) { ElMessage.error('内核重启请求失败') }
                    restarting.value = false
                }
                const openZashboard = () => {
                    const ip = window.location.hostname
                    // 修复参数顺序：参数必须在 #/ 之前，Zashboard 才能正确读取
                    window.open(`http://${ip}:9090/ui/?hostname=${ip}&port=9090&secret=123456#/`, '_blank')
                }

                onMounted(() => { loadConfig() })

                return { activeTab, subUrl, rawYaml, configText, restarting, updating, updateSub, saveRawYaml, restartMihomo, loadConfig, openZashboard }
            }
        }).use(ElementPlus).mount('#app')
    </script>
</body>
</html>
